      operations:
      - method: PATCH
        name: updaterunnerscheduling
        description: Update runner scheduling status
        call: admin-runners.updaterunnerscheduling
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runners/{id}/draining
      name: runners-id-draining
