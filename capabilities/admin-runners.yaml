      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: admin-runners.deleterunner
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-get-runner-by-id
      description: Get runner by ID
      hints:
        readOnly: true
