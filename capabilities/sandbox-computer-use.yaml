        description: Type text with optional delay between keystrokes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: computeruse-mouse-click
      path: /computeruse/mouse/click
      operations:
      - name: click
        method: POST
