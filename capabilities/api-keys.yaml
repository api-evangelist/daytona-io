naftiko: 1.0.0-alpha2
info:
  label: Daytona API Keys
  description: 'Daytona API Keys. 6 operations. Lead operation: Create API key. Self-contained Naftiko capability covering
    one Daytona business surface.'
  tags:
  - Daytona
  - Api-Keys
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    DAYTONA_API_KEY: DAYTONA_API_KEY
capability:
  consumes:
  - type: http
    namespace: api-keys
    baseUri: https://app.daytona.io/api
    description: Daytona API Keys business capability. Self-contained, no shared references.
    resources:
    - name: api-keys
      path: /api-keys
      operations:
      - name: createapikey
        method: POST
        description: Create API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listapikeys
        method: GET
        description: List API keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-keys-current
      path: /api-keys/current
      operations:
      - name: getcurrentapikey
        method: GET
        description: Get current API key's details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-keys-name
      path: /api-keys/{name}
      operations:
      - name: getapikey
        method: GET
        description: Get API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteapikey
        method: DELETE
        description: Delete API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-keys-userid-name
      path: /api-keys/{userId}/{name}
      operations:
      - name: deleteapikeyforuser
        method: DELETE
        description: Delete API key for user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      value: '{{env.DAYTONA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: api-keys-rest
    port: 8080
    description: REST adapter for Daytona API Keys. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/api-keys
      name: api-keys
      description: REST surface for api-keys.
      operations:
      - method: POST
        name: createapikey
        description: Create API key
        call: api-keys.createapikey
        outputParameters:
        - type: object
          mapping: $.
        with:
          body: rest.body
      - method: GET
        name: listapikeys
        description: List API keys
        call: api-keys.listapikeys
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-keys/current
      name: api-keys-current
      description: REST surface for api-keys-current.
      operations:
      - method: GET
        name: getcurrentapikey
        description: Get current API key's details
        call: api-keys.getcurrentapikey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-keys/{name}
      name: api-keys-name
      description: REST surface for api-keys-name.
      operations:
      - method: GET
        name: getapikey
        description: Get API key
        call: api-keys.getapikey
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapikey
        description: Delete API key
        call: api-keys.deleteapikey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api-keys/{userId}/{name}
      name: api-keys-userid-name
      description: REST surface for api-keys-userid-name.
      operations:
      - method: DELETE
        name: deleteapikeyforuser
        description: Delete API key for user
        call: api-keys.deleteapikeyforuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: api-keys-mcp
    port: 9090
    transport: http
    description: MCP adapter for Daytona API Keys. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: daytona-create-api-key
      description: Create API key
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-keys.createapikey
      outputParameters:
      - type: object
        mapping: $.
      with:
        body: tools.body
    - name: daytona-list-api-keys
      description: List API keys
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-keys.listapikeys
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-get-current-api-key-s-details
      description: Get current API key's details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-keys.getcurrentapikey
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-get-api-key
      description: Get API key
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-keys.getapikey
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-delete-api-key
      description: Delete API key
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: api-keys.deleteapikey
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-delete-api-key-for-user
      description: Delete API key for user
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: api-keys.deleteapikeyforuser
      outputParameters:
      - type: object
        mapping: $.
