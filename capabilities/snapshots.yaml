naftiko: 1.0.0-alpha2
info:
  label: Daytona Snapshots
  description: 'Daytona Snapshots. 8 operations. Lead operation: Create a new snapshot. Self-contained Naftiko capability
    covering one Daytona business surface.'
  tags:
  - Daytona
  - Snapshots
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    DAYTONA_API_KEY: DAYTONA_API_KEY
capability:
  consumes:
  - type: http
    namespace: snapshots
    baseUri: https://app.daytona.io/api
    description: Daytona Snapshots business capability. Self-contained, no shared references.
    resources:
    - name: snapshots
      path: /snapshots
      operations:
      - name: createsnapshot
        method: POST
        description: Create a new snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getallsnapshots
        method: GET
        description: List all snapshots
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshots-id
      path: /snapshots/{id}
      operations:
      - name: getsnapshot
        method: GET
        description: Get snapshot by ID or name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: removesnapshot
        method: DELETE
        description: Delete snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshots-id-build-logs
      path: /snapshots/{id}/build-logs
      operations:
      - name: getsnapshotbuildlogs
        method: GET
        description: This endpoint is deprecated. Use `getSnapshotBuildLogsUrl` instead.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshots-id-build-logs-url
      path: /snapshots/{id}/build-logs-url
      operations:
      - name: getsnapshotbuildlogsurl
        method: GET
        description: Get snapshot build logs URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshots-id-activate
      path: /snapshots/{id}/activate
      operations:
      - name: activatesnapshot
        method: POST
        description: Activate a snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: snapshots-id-deactivate
      path: /snapshots/{id}/deactivate
      operations:
      - name: deactivatesnapshot
        method: POST
        description: Deactivate a snapshot
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      value: '{{env.DAYTONA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: snapshots-rest
    port: 8080
    description: REST adapter for Daytona Snapshots. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/snapshots
      name: snapshots
      description: REST surface for snapshots.
      operations:
      - method: POST
        name: createsnapshot
        description: Create a new snapshot
        call: snapshots.createsnapshot
        outputParameters:
        - type: object
          mapping: $.
        with:
          body: rest.body
      - method: GET
        name: getallsnapshots
        description: List all snapshots
        call: snapshots.getallsnapshots
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/snapshots/{id}
      name: snapshots-id
      description: REST surface for snapshots-id.
      operations:
      - method: GET
        name: getsnapshot
        description: Get snapshot by ID or name
        call: snapshots.getsnapshot
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: removesnapshot
        description: Delete snapshot
        call: snapshots.removesnapshot
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/snapshots/{id}/build-logs
      name: snapshots-id-build-logs
      description: REST surface for snapshots-id-build-logs.
      operations:
      - method: GET
        name: getsnapshotbuildlogs
        description: This endpoint is deprecated. Use `getSnapshotBuildLogsUrl` instead.
        call: snapshots.getsnapshotbuildlogs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/snapshots/{id}/build-logs-url
      name: snapshots-id-build-logs-url
      description: REST surface for snapshots-id-build-logs-url.
      operations:
      - method: GET
        name: getsnapshotbuildlogsurl
        description: Get snapshot build logs URL
        call: snapshots.getsnapshotbuildlogsurl
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/snapshots/{id}/activate
      name: snapshots-id-activate
      description: REST surface for snapshots-id-activate.
      operations:
      - method: POST
        name: activatesnapshot
        description: Activate a snapshot
        call: snapshots.activatesnapshot
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/snapshots/{id}/deactivate
      name: snapshots-id-deactivate
      description: REST surface for snapshots-id-deactivate.
      operations:
      - method: POST
        name: deactivatesnapshot
        description: Deactivate a snapshot
        call: snapshots.deactivatesnapshot
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: snapshots-mcp
    port: 9090
    transport: http
    description: MCP adapter for Daytona Snapshots. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: daytona-create-a-new-snapshot
      description: Create a new snapshot
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: snapshots.createsnapshot
      outputParameters:
      - type: object
        mapping: $.
      with:
        body: tools.body
    - name: daytona-list-all-snapshots
      description: List all snapshots
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: snapshots.getallsnapshots
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-get-snapshot-by-id-or-name
      description: Get snapshot by ID or name
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: snapshots.getsnapshot
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-delete-snapshot
      description: Delete snapshot
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: snapshots.removesnapshot
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-get-snapshot-build-logs
      description: This endpoint is deprecated. Use `getSnapshotBuildLogsUrl` instead.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: snapshots.getsnapshotbuildlogs
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-get-snapshot-build-logs-url
      description: Get snapshot build logs URL
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: snapshots.getsnapshotbuildlogsurl
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-activate-a-snapshot
      description: Activate a snapshot
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: snapshots.activatesnapshot
      outputParameters:
      - type: object
        mapping: $.
    - name: daytona-deactivate-a-snapshot
      description: Deactivate a snapshot
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: snapshots.deactivatesnapshot
      outputParameters:
      - type: object
        mapping: $.
