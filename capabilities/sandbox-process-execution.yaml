naftiko: 1.0.0-alpha2
info:
  label: Daytona Sandbox Process Execution
  description: 'Daytona Sandbox Process Execution. 24 operations. Lead operation: Get a list of all currently active ports.
    Self-contained Naftiko capability covering one Daytona business surface.'
  tags:
  - Daytona
  - Process
  - Interpreter
  - Port
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    DAYTONA_API_KEY: DAYTONA_API_KEY
capability:
  consumes:
  - type: http
    namespace: sandbox-process-execution
    baseUri: https://proxy.app.daytona.io/toolbox
    description: Daytona Sandbox Process Execution business capability. Self-contained, no shared references.
    resources:
    - name: port
      path: /port
      operations:
      - name: getports
        method: GET
        description: Get a list of all currently active ports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: port-port-in-use
      path: /port/{port}/in-use
      operations:
      - name: isportinuse
        method: GET
        description: Check if a specific port is currently in use
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-code-run
      path: /process/code-run
      operations:
      - name: coderun
        method: POST
        description: Execute Python, JavaScript, or TypeScript code and return output, exit code, and artifacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-execute
      path: /process/execute
      operations:
      - name: executecommand
        method: POST
        description: Execute a shell command and return the output and exit code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-interpreter-context
      path: /process/interpreter/context
      operations:
      - name: listinterpretercontexts
        method: GET
        description: Returns information about all user-created interpreter contexts (excludes default context)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createinterpretercontext
        method: POST
        description: Creates a new isolated interpreter context with optional working directory and language
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-interpreter-context-id
      path: /process/interpreter/context/{id}
      operations:
      - name: deleteinterpretercontext
        method: DELETE
        description: Deletes an interpreter context and shuts down its worker process
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-interpreter-execute
      path: /process/interpreter/execute
      operations:
      - name: executeinterpretercode
        method: GET
        description: Executes code in a specified context (or default context if not specified) via WebSocket streaming
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-pty
      path: /process/pty
      operations:
      - name: listptysessions
        method: GET
        description: Get a list of all active pseudo-terminal sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createptysession
        method: POST
        description: Create a new pseudo-terminal session with specified configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-pty-sessionid
      path: /process/pty/{sessionId}
      operations:
      - name: getptysession
        method: GET
        description: Get detailed information about a specific pseudo-terminal session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteptysession
        method: DELETE
        description: Delete a pseudo-terminal session and terminate its process
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-pty-sessionid-connect
      path: /process/pty/{sessionId}/connect
      operations:
      - name: connectptysession
        method: GET
        description: Establish a WebSocket connection to interact with a pseudo-terminal session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-pty-sessionid-resize
      path: /process/pty/{sessionId}/resize
      operations:
      - name: resizeptysession
        method: POST
        description: Resize the terminal dimensions of a pseudo-terminal session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session
      path: /process/session
      operations:
      - name: listsessions
        method: GET
        description: Get a list of all active shell sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsession
        method: POST
        description: Create a new shell session for command execution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-entrypoint
      path: /process/session/entrypoint
      operations:
      - name: getentrypointsession
        method: GET
        description: Get details of an entrypoint session including its commands
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-entrypoint-logs
      path: /process/session/entrypoint/logs
      operations:
      - name: getentrypointlogs
        method: GET
        description: Get logs for a sandbox entrypoint session. Returns JSON with separated stdout/stderr for SDK >= 0.161.0,
          plain text otherwise. Supports WebSocket streaming.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-sessionid
      path: /process/session/{sessionId}
      operations:
      - name: getsession
        method: GET
        description: Get details of a specific session including its commands
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletesession
        method: DELETE
        description: Delete an existing shell session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-sessionid-command-commandid
      path: /process/session/{sessionId}/command/{commandId}
      operations:
      - name: getsessioncommand
        method: GET
        description: Get details of a specific command within a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-sessionid-command-commandid-input
      path: /process/session/{sessionId}/command/{commandId}/input
      operations:
      - name: sendinput
        method: POST
        description: Send input data to a running command in a session for interactive execution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-sessionid-command-commandid-logs
      path: /process/session/{sessionId}/command/{commandId}/logs
      operations:
      - name: getsessioncommandlogs
        method: GET
        description: Get logs for a specific command within a session. Returns JSON with separated stdout/stderr for SDK >=
          0.167.0, plain text otherwise. Supports WebSocket streaming.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: process-session-sessionid-exec
      path: /process/session/{sessionId}/exec
      operations:
      - name: sessionexecutecommand
        method: POST
        description: Execute a command within an existing shell session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      value: '{{env.DAYTONA_API_KEY}}'
      placement: header
