naftiko: 1.0.0-alpha2
info:
  label: Daytona Sandbox Filesystem
  description: 'Daytona Sandbox Filesystem. 13 operations. Lead operation: List files and directories in the specified path.
    Self-contained Naftiko capability covering one Daytona business surface.'
  tags:
  - Daytona
  - File-System
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    DAYTONA_API_KEY: DAYTONA_API_KEY
capability:
  consumes:
  - type: http
    namespace: sandbox-filesystem
    baseUri: https://proxy.app.daytona.io/toolbox
    description: Daytona Sandbox Filesystem business capability. Self-contained, no shared references.
    resources:
    - name: files
      path: /files
      operations:
      - name: listfiles
        method: GET
        description: List files and directories in the specified path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletefile
        method: DELETE
        description: Delete a file or directory at the specified path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-bulk-download
      path: /files/bulk-download
      operations:
      - name: downloadfiles
        method: POST
        description: Download multiple files by providing their paths. Successful files are returned as multipart parts named
          `file`. Per-file failures are returned as multipart parts named `error` with JSON payloads shap
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-bulk-upload
      path: /files/bulk-upload
      operations:
      - name: uploadfiles
        method: POST
        description: Upload multiple files with their destination paths
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-download
      path: /files/download
      operations:
      - name: downloadfile
        method: GET
        description: Download a file by providing its path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-find
      path: /files/find
      operations:
      - name: findinfiles
        method: GET
        description: Search for text pattern within files in a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-folder
      path: /files/folder
      operations:
      - name: createfolder
        method: POST
        description: Create a folder with the specified path and optional permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-info
      path: /files/info
      operations:
      - name: getfileinfo
        method: GET
        description: Get detailed information about a file or directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-move
      path: /files/move
      operations:
      - name: movefile
        method: POST
        description: Move or rename a file or directory from source to destination
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-permissions
      path: /files/permissions
      operations:
      - name: setfilepermissions
        method: POST
        description: Set file permissions, ownership, and group for a file or directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-replace
      path: /files/replace
      operations:
      - name: replaceinfiles
        method: POST
        description: Replace text pattern with new value in multiple files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-search
      path: /files/search
      operations:
      - name: searchfiles
        method: GET
        description: Search for files matching a specific pattern in a directory
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-upload
      path: /files/upload
      operations:
      - name: uploadfile
        method: POST
        description: Upload a file to the specified path
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      value: '{{env.DAYTONA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sandbox-filesystem-rest
    port: 8080
    description: REST adapter for Daytona Sandbox Filesystem. One Spectral-compliant resource per consumed operation, prefixed
