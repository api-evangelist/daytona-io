openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Secret API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: Secret
paths:
  /secret:
    get:
      deprecated: true
      description: This endpoint is deprecated and fails for organizations with more than 1500 secrets. Use `listSecretsPaginated` instead.
      operationId: listSecrets
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Secret'
                type: array
          description: List of all secrets (metadata only, values are not returned)
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List secrets
      tags:
      - Secret
    post:
      operationId: createSecret
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecret'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: The secret has been successfully created.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create secret
      tags:
      - Secret
  /secret/paginated:
    get:
      operationId: listSecretsPaginated
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Pagination cursor from a previous response
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: Number of results per page
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Filter by partial name match
        explode: true
        in: query
        name: name
        required: false
        schema:
          example: MY_API_KEY
          type: string
        style: form
      - description: Field to sort by
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: createdAt
          enum:
          - name
          - createdAt
          - updatedAt
          type: string
        style: form
      - description: Direction to sort by
        explode: true
        in: query
        name: order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
          description: Paginated list of secrets (metadata only, values are not returned)
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List secrets with pagination
      tags:
      - Secret
  /secret/{secretId}:
    delete:
      operationId: deleteSecret
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the secret
        explode: false
        in: path
        name: secretId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: The secret has been successfully deleted.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Delete secret
      tags:
      - Secret
    get:
      operationId: getSecret
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the secret
        explode: false
        in: path
        name: secretId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: The secret metadata (value is not returned)
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get secret
      tags:
      - Secret
    patch:
      operationId: updateSecret
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the secret
        explode: false
        in: path
        name: secretId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecret'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: The secret has been successfully updated.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Update secret
      tags:
      - Secret
components:
  schemas:
    UpdateSecret:
      example:
        hosts:
        - api.anthropic.com
        description: description
        value: value
      properties:
        value:
          description: New secret value
          type: string
        description:
          description: Optional description of the secret
          type: string
        hosts:
          description: Allowed hosts this secret may be sent to
          example:
          - api.anthropic.com
          items:
            type: string
          type: array
      type: object
    CreateSecret:
      example:
        hosts:
        - api.anthropic.com
        name: MY_API_KEY
        description: description
        value: value
      properties:
        name:
          description: Secret name (alphanumeric, hyphens, underscores)
          example: MY_API_KEY
          type: string
        value:
          description: Secret value
          type: string
        description:
          description: Optional description of the secret
          type: string
        hosts:
          description: Allowed hosts this secret may be sent to
          example:
          - api.anthropic.com
          items:
            type: string
          type: array
      required:
      - name
      - value
      type: object
    ListSecretsResponse:
      example:
        nextCursor: nextCursor
        total: 0
        items:
        - createdAt: '2024-01-31T12:00:00.000Z'
          hosts:
          - api.anthropic.com
          name: MY_API_KEY
          description: API key for external service
          id: 123e4567-e89b-12d3-a456-426614174000
          placeholder: dtn_secret_a7f3b2c1e9d4f6g8
          updatedAt: '2024-01-31T12:00:00.000Z'
        - createdAt: '2024-01-31T12:00:00.000Z'
          hosts:
          - api.anthropic.com
          name: MY_API_KEY
          description: API key for external service
          id: 123e4567-e89b-12d3-a456-426614174000
          placeholder: dtn_secret_a7f3b2c1e9d4f6g8
          updatedAt: '2024-01-31T12:00:00.000Z'
      properties:
        items:
          description: List of results for the current page
          items:
            $ref: '#/components/schemas/Secret'
          type: array
        total:
          description: Total number of secrets matching the filters
          type: integer
        nextCursor:
          description: Cursor for the next page of results
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
      - total
      type: object
    Secret:
      example:
        createdAt: '2024-01-31T12:00:00.000Z'
        hosts:
        - api.anthropic.com
        name: MY_API_KEY
        description: API key for external service
        id: 123e4567-e89b-12d3-a456-426614174000
        placeholder: dtn_secret_a7f3b2c1e9d4f6g8
        updatedAt: '2024-01-31T12:00:00.000Z'
      properties:
        id:
          description: Secret ID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        name:
          description: Secret name
          example: MY_API_KEY
          type: string
        description:
          description: Optional description of the secret
          example: API key for external service
          type: string
        createdAt:
          description: Creation timestamp
          example: '2024-01-31T12:00:00.000Z'
          format: date-time
          type: string
        placeholder:
          description: Opaque placeholder token injected as env var value in sandboxes
          example: dtn_secret_a7f3b2c1e9d4f6g8
          type: string
        hosts:
          description: Allowed hosts this secret may be sent to
          example:
          - api.anthropic.com
          items:
            type: string
          type: array
        updatedAt:
          description: Last update timestamp
          example: '2024-01-31T12:00:00.000Z'
          format: date-time
          type: string
      required:
      - createdAt
      - hosts
      - id
      - name
      - placeholder
      - updatedAt
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: API Key access
      scheme: bearer
      type: http
    oauth2:
      openIdConnectUrl: http://localhost:3000/.well-known/openid-configuration
      type: openIdConnect
x-provenance:
  method: harvested
  publisher: Daytona
  source: https://www.daytona.io/docs/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
