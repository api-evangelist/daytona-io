openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona API Keys API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: API Keys
paths:
  /api-keys:
    get:
      operationId: listApiKeys
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyList'
                type: array
          description: API keys retrieved successfully.
        '500':
          description: Error fetching API keys.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List API keys
      tags:
      - API Keys
    post:
      operationId: createApiKey
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKey'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
          description: API key created successfully.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create API key
      tags:
      - API Keys
  /api-keys/current:
    get:
      operationId: getCurrentApiKey
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
          description: API key retrieved successfully.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get current API key's details
      tags:
      - API Keys
  /api-keys/{name}:
    delete:
      operationId: deleteApiKey
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: API key deleted successfully.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Delete API key
      tags:
      - API Keys
    get:
      operationId: getApiKey
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
          description: API key retrieved successfully.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get API key
      tags:
      - API Keys
  /api-keys/{userId}/{name}:
    delete:
      operationId: deleteApiKeyForUser
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: API key deleted successfully.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Delete API key for user
      tags:
      - API Keys
components:
  schemas:
    CreateApiKey:
      example:
        permissions:
        - write:registries
        - write:registries
        name: My API Key
        expiresAt: '2025-06-09T12:00:00.000Z'
      properties:
        name:
          description: The name of the API key
          example: My API Key
          type: string
        permissions:
          description: The list of organization resource permissions explicitly assigned to the API key
          items:
            enum:
            - write:registries
            - delete:registries
            - write:snapshots
            - delete:snapshots
            - write:sandboxes
            - delete:sandboxes
            - read:volumes
            - write:volumes
            - delete:volumes
            - write:regions
            - delete:regions
            - read:runners
            - write:runners
            - delete:runners
            - read:audit_logs
            - manage:api_keys
            - manage:secrets
            - read:limits
            - manage:sso
            - read:billing
            - manage:billing
            type: string
            x-enum-varnames:
            - WRITE_REGISTRIES
            - DELETE_REGISTRIES
            - WRITE_SNAPSHOTS
            - DELETE_SNAPSHOTS
            - WRITE_SANDBOXES
            - DELETE_SANDBOXES
            - READ_VOLUMES
            - WRITE_VOLUMES
            - DELETE_VOLUMES
            - WRITE_REGIONS
            - DELETE_REGIONS
            - READ_RUNNERS
            - WRITE_RUNNERS
            - DELETE_RUNNERS
            - READ_AUDIT_LOGS
            - MANAGE_API_KEYS
            - MANAGE_SECRETS
            - READ_LIMITS
            - MANAGE_SSO
            - READ_BILLING
            - MANAGE_BILLING
          type: array
        expiresAt:
          description: When the API key expires
          example: '2025-06-09T12:00:00.000Z'
          format: date-time
          type:
          - string
          - 'null'
      required:
      - name
      - permissions
      type: object
    ApiKeyList:
      example:
        organizationId: 123e4567-e89b-12d3-a456-426614174000
        createdAt: '2024-03-14T12:00:00.000Z'
        lastUsedAt: '2024-03-14T12:00:00.000Z'
        permissions:
        - write:registries
        - write:registries
        name: My API Key
        value: bb_********************def
        userId: '123'
        expiresAt: '2024-03-14T12:00:00.000Z'
      properties:
        name:
          description: The name of the API key
          example: My API Key
          type: string
        value:
          description: The masked API key value
          example: bb_********************def
          type: string
        createdAt:
          description: When the API key was created
          example: '2024-03-14T12:00:00.000Z'
          format: date-time
          type: string
        permissions:
          description: The list of organization resource permissions assigned to the API key
          items:
            enum:
            - write:registries
            - delete:registries
            - write:snapshots
            - delete:snapshots
            - write:sandboxes
            - delete:sandboxes
            - read:volumes
            - write:volumes
            - delete:volumes
            - write:regions
            - delete:regions
            - read:runners
            - write:runners
            - delete:runners
            - read:audit_logs
            - manage:api_keys
            - manage:secrets
            - read:limits
            - manage:sso
            - read:billing
            - manage:billing
            type: string
            x-enum-varnames:
            - WRITE_REGISTRIES
            - DELETE_REGISTRIES
            - WRITE_SNAPSHOTS
            - DELETE_SNAPSHOTS
            - WRITE_SANDBOXES
            - DELETE_SANDBOXES
            - READ_VOLUMES
            - WRITE_VOLUMES
            - DELETE_VOLUMES
            - WRITE_REGIONS
            - DELETE_REGIONS
            - READ_RUNNERS
            - WRITE_RUNNERS
            - DELETE_RUNNERS
            - READ_AUDIT_LOGS
            - MANAGE_API_KEYS
            - MANAGE_SECRETS
            - READ_LIMITS
            - MANAGE_SSO
            - READ_BILLING
            - MANAGE_BILLING
          type: array
        lastUsedAt:
          description: When the API key was last used
          example: '2024-03-14T12:00:00.000Z'
          format: date-time
          type:
          - string
          - 'null'
        expiresAt:
          description: When the API key expires
          example: '2024-03-14T12:00:00.000Z'
          format: date-time
          type:
          - string
          - 'null'
        userId:
          description: The user ID of the user who created the API key
          example: '123'
          type: string
        organizationId:
          description: The organization ID associated with the API key
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
      required:
      - createdAt
      - expiresAt
      - lastUsedAt
      - name
      - permissions
      - userId
      - value
      type: object
    ApiKeyResponse:
      example:
        createdAt: '2024-03-14T12:00:00.000Z'
        permissions:
        - write:registries
        - write:registries
        name: My API Key
        value: bb_sk_1234567890abcdef
        expiresAt: '2025-06-09T12:00:00.000Z'
      properties:
        name:
          description: The name of the API key
          example: My API Key
          type: string
        value:
          description: The API key value
          example: bb_sk_1234567890abcdef
          type: string
        createdAt:
          description: When the API key was created
          example: '2024-03-14T12:00:00.000Z'
          format: date-time
          type: string
        permissions:
          description: The list of organization resource permissions assigned to the API key
          items:
            enum:
            - write:registries
            - delete:registries
            - write:snapshots
            - delete:snapshots
            - write:sandboxes
            - delete:sandboxes
            - read:volumes
            - write:volumes
            - delete:volumes
            - write:regions
            - delete:regions
            - read:runners
            - write:runners
            - delete:runners
            - read:audit_logs
            - manage:api_keys
            - manage:secrets
            - read:limits
            - manage:sso
            - read:billing
            - manage:billing
            type: string
            x-enum-varnames:
            - WRITE_REGISTRIES
            - DELETE_REGISTRIES
            - WRITE_SNAPSHOTS
            - DELETE_SNAPSHOTS
            - WRITE_SANDBOXES
            - DELETE_SANDBOXES
            - READ_VOLUMES
            - WRITE_VOLUMES
            - DELETE_VOLUMES
            - WRITE_REGIONS
            - DELETE_REGIONS
            - READ_RUNNERS
            - WRITE_RUNNERS
            - DELETE_RUNNERS
            - READ_AUDIT_LOGS
            - MANAGE_API_KEYS
            - MANAGE_SECRETS
            - READ_LIMITS
            - MANAGE_SSO
            - READ_BILLING
            - MANAGE_BILLING
          type: array
        expiresAt:
          description: When the API key expires
          example: '2025-06-09T12:00:00.000Z'
          format: date-time
          type:
          - string
          - 'null'
      required:
      - createdAt
      - expiresAt
      - name
      - permissions
      - value
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: API Key access
      scheme: bearer
      type: http
    oauth2:
      openIdConnectUrl: http://localhost:3000/.well-known/openid-configuration
      type: openIdConnect
