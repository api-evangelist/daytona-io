openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Sandbox API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: Sandbox
paths:
  /sandbox:
    get:
      description: Advanced filtering and ordering. Eventually consistent.
      operationId: listSandboxes
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Pagination cursor from a previous response
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: Number of results per page
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Filter by ID prefix (case-insensitive)
        explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      - description: Filter by name prefix (case-insensitive)
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - description: JSON encoded labels to filter by
        explode: true
        in: query
        name: labels
        required: false
        schema:
          example: '{"label1": "value1", "label2": "value2"}'
          type: string
        style: form
      - description: Include results with errored state and deleted desired state
        explode: true
        in: query
        name: includeErroredDeleted
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include unclaimed warm pool sandboxes (excluded by default)
        explode: true
        in: query
        name: includeWarm
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: List of states to filter by.
        explode: true
        in: query
        name: states
        required: false
        schema:
          items:
            $ref: '#/components/schemas/SandboxState'
          type: array
        style: form
      - description: List of snapshot names to filter by
        explode: true
        in: query
        name: snapshots
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: List of regions IDs to filter by
        explode: true
        in: query
        name: regionIds
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: List of sandbox classes to filter by
        explode: true
        in: query
        name: sandboxClasses
        required: false
        schema:
          items:
            $ref: '#/components/schemas/SandboxClass'
          type: array
        style: form
      - description: Minimum CPU
        explode: true
        in: query
        name: minCpu
        required: false
        schema:
          minimum: 1
          type: number
        style: form
      - description: Maximum CPU
        explode: true
        in: query
        name: maxCpu
        required: false
        schema:
          minimum: 1
          type: number
        style: form
      - description: Minimum memory in GiB
        explode: true
        in: query
        name: minMemoryGiB
        required: false
        schema:
          minimum: 1
          type: number
        style: form
      - description: Maximum memory in GiB
        explode: true
        in: query
        name: maxMemoryGiB
        required: false
        schema:
          minimum: 1
          type: number
        style: form
      - description: Minimum disk space in GiB
        explode: true
        in: query
        name: minDiskGiB
        required: false
        schema:
          minimum: 1
          type: number
        style: form
      - description: Maximum disk space in GiB
        explode: true
        in: query
        name: maxDiskGiB
        required: false
        schema:
          minimum: 1
          type: number
        style: form
      - description: Minimum GPU
        explode: true
        in: query
        name: minGpu
        required: false
        schema:
          minimum: 0
          type: number
        style: form
      - description: Maximum GPU
        explode: true
        in: query
        name: maxGpu
        required: false
        schema:
          minimum: 0
          type: number
        style: form
      - description: Filter by public status
        explode: true
        in: query
        name: isPublic
        required: false
        schema:
          type: boolean
        style: form
      - description: Filter by recoverable status
        explode: true
        in: query
        name: isRecoverable
        required: false
        schema:
          type: boolean
        style: form
      - description: Include items created after this timestamp
        explode: true
        in: query
        name: createdAtAfter
        required: false
        schema:
          example: '2024-01-01T00:00:00.000Z'
          format: date-time
          type: string
        style: form
      - description: Include items created before this timestamp
        explode: true
        in: query
        name: createdAtBefore
        required: false
        schema:
          example: '2024-12-31T23:59:59.000Z'
          format: date-time
          type: string
        style: form
      - description: Include items with last event after this timestamp
        explode: true
        in: query
        name: lastEventAfter
        required: false
        schema:
          example: '2024-01-01T00:00:00.000Z'
          format: date-time
          type: string
        style: form
      - description: Include items with last event before this timestamp
        explode: true
        in: query
        name: lastEventBefore
        required: false
        schema:
          example: '2024-12-31T23:59:59.000Z'
          format: date-time
          type: string
        style: form
      - description: Include items scheduled for auto destroy after this timestamp
        explode: true
        in: query
        name: autoDestroyAtAfter
        required: false
        schema:
          example: '2024-01-01T00:00:00.000Z'
          format: date-time
          type: string
        style: form
      - description: Include items scheduled for auto destroy before this timestamp
        explode: true
        in: query
        name: autoDestroyAtBefore
        required: false
        schema:
          example: '2024-12-31T23:59:59.000Z'
          format: date-time
          type: string
        style: form
      - description: Field to sort by
        explode: true
        in: query
        name: sort
        required: false
        schema:
          $ref: '#/components/schemas/SandboxListSortField'
        style: form
      - description: Direction to sort by
        explode: true
        in: query
        name: order
        required: false
        schema:
          $ref: '#/components/schemas/SandboxListSortDirection'
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSandboxesResponse'
          description: ''
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List sandboxes
      tags:
      - Sandbox
    post:
      operationId: createSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandbox'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: The sandbox has been successfully created.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create a new sandbox
      tags:
      - Sandbox
  /sandbox/for-runner:
    get:
      operationId: getSandboxesForRunner
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Comma-separated list of sandbox states to filter by
        explode: true
        in: query
        name: states
        required: false
        schema:
          type: string
        style: form
      - description: Skip sandboxes where state differs from desired state
        explode: true
        in: query
        name: skipReconcilingSandboxes
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Sandbox'
                type: array
          description: List of sandboxes for the authenticated runner
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandboxes for the authenticated runner
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}:
    delete:
      operationId: deleteSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox has been deleted
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Delete sandbox
      tags:
      - Sandbox
    get:
      description: Sandboxes destroyed by spot preemption remain retrievable for 24 hours so `spotEvictedAt` can be read. Sandboxes destroyed by queue timeout remain retrievable for 24 hours so `queueTimedOutAt` can be read.
      operationId: getSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      - description: Include verbose output
        explode: true
        in: query
        name: verbose
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox details
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandbox details
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/recover:
    post:
      operationId: recoverSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      - description: If true, the sandbox is left in STOPPED after recovery instead of being started.
        explode: true
        in: query
        name: skipStart
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Recovery initiated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Recover sandbox from error state
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/start:
    post:
      description: Starts a stopped or archived sandbox, or resumes a paused sandbox. The transition taken depends on the current sandbox state.
      operationId: startSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox has been started, is being restored from archived state, or is being resumed from paused
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Start or resume sandbox
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/stop:
    post:
      operationId: stopSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      - description: Force stop the sandbox using SIGKILL instead of SIGTERM
        explode: true
        in: query
        name: force
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox has been stopped
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Stop sandbox
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/pause:
    post:
      operationId: pauseSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox pause has been initiated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Pause sandbox
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/resize:
    post:
      operationId: resizeSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeSandbox'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox has been resized
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Resize sandbox resources
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/labels:
    put:
      operationId: replaceLabels
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxLabels'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLabels'
          description: Labels have been successfully replaced
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Replace sandbox labels
      tags:
      - Sandbox
  /sandbox/{sandboxId}/state:
    put:
      operationId: updateSandboxState
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSandboxStateDto'
        required: true
      responses:
        '200':
          description: Sandbox state has been successfully updated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Update sandbox state
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/backup:
    post:
      deprecated: true
      description: 'Deprecated: backups are managed automatically. This endpoint is a no-op kept for compatibility.'
      operationId: createBackup
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Sandbox backup request acknowledged (no-op)
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create sandbox backup
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/snapshot:
    post:
      operationId: createSandboxSnapshot
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxSnapshot'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Snapshot creation has been initiated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create a snapshot from a sandbox
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/fork:
    post:
      operationId: forkSandbox
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSandbox'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Fork operation has been initiated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Fork a sandbox
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/forks:
    get:
      operationId: getSandboxForks
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: includeDestroyed
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Sandbox'
                type: array
          description: ''
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandbox fork children
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/parent:
    get:
      operationId: getSandboxParent
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: ''
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandbox fork parent
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/ancestors:
    get:
      operationId: getSandboxAncestors
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Sandbox'
                type: array
          description: ''
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandbox fork ancestor chain
      tags:
      - Sandbox
  /sandbox/{sandboxIdOrName}/public/{isPublic}:
    post:
      operationId: updatePublicStatus
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID or name of the sandbox
        explode: false
        in: path
        name: sandboxIdOrName
        required: true
        schema:
          type: string
        style: simple
      - description: Public status to set
        explode: false
        in: path
        name: isPublic
        required: true
        schema:
          type: boolean
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
          description: Public status has been successfully updated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Update public status
      tags:
      - Sandbox
  /sandbox/{sandboxId}/signing-key:
    get:
      operationId: getSandboxSigningKey
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Signing key of the sandbox
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get the signing key for a sandbox
      tags:
      - Sandbox
  /sandbox/{sandboxId}/signing-key/rotate:
    post:
      operationId: rotateSigningKey
      parameters:
      - description: Use with JWT to specify the organization ID
