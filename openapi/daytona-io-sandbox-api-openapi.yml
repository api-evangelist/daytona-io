      summary: Get sandbox traces
      tags:
      - Sandbox
  /sandbox/{sandboxId}/telemetry/traces/{traceId}:
    get:
      description: Retrieve all spans for a specific trace
      operationId: getSandboxTraceSpans
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      - description: ID of the trace
        explode: false
        in: path
        name: traceId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TraceSpan'
                type: array
          description: List of spans in the trace
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get trace spans
      tags:
      - Sandbox
  /sandbox/{sandboxId}/telemetry/metrics:
    get:
      description: Retrieve OTEL metrics for a sandbox within a time range
      operationId: getSandboxMetrics
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      - description: Start of time range (ISO 8601)
        explode: true
        in: query
        name: from
        required: true
        schema:
          format: date-time
          type: string
        style: form
      - description: End of time range (ISO 8601)
        explode: true
        in: query
        name: to
        required: true
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter by metric names
        explode: true
        in: query
        name: metricNames
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: Metrics time series data
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandbox metrics
      tags:
      - Sandbox
components:
  schemas:
    UpdateSandboxStateDto:
      example:
        errorReason: Failed to pull snapshot image
        recoverable: true
        state: started
      properties:
        state:
          description: The new state for the sandbox
          enum:
          - creating
          - restoring
          - destroyed
          - destroying
          - started
          - stopped
          - starting
          - stopping
          - error
          - build_failed
          - pending_build
          - building_snapshot
          - unknown
          - pulling_snapshot
          - archived
          - archiving
          - resizing
          - snapshotting
          - forking
          - pausing
          - paused
          - resuming
          example: started
          type: string
        errorReason:
          description: Optional error message when reporting an error state
          example: Failed to pull snapshot image
          type: string
        recoverable:
          description: Whether the sandbox is recoverable
          example: true
          type: boolean
      required:
      - state
      type: object
    SandboxLabels:
      example:
        labels:
          environment: dev
          team: backend
      properties:
        labels:
          additionalProperties:
            type: string
          description: Key-value pairs of labels
          example:
            environment: dev
            team: backend
          type: object
      required:
      - labels
      type: object
    ForkSandbox:
      example:
        name: my-forked-sandbox
      properties:
        name:
          description: The name for the forked sandbox. If not provided, a unique name will be generated.
          example: my-forked-sandbox
          type: string
      type: object
    TraceSpan:
      example:
        traceId: traceId
        spanId: spanId
        spanAttributes:
          key: spanAttributes
        parentSpanId: parentSpanId
        durationNs: 0.8008281904610115
        statusMessage: statusMessage
        spanName: spanName
        timestamp: timestamp
        statusCode: statusCode
      properties:
        traceId:
          description: Trace identifier
          type: string
        spanId:
          description: Span identifier
          type: string
        parentSpanId:
          description: Parent span identifier
          type: string
        spanName:
          description: Span name
          type: string
        timestamp:
          description: Span start timestamp
          type: string
        durationNs:
          description: Span duration in nanoseconds
          type: number
        spanAttributes:
          additionalProperties:
            type: string
          description: Span attributes
          type: object
        statusCode:
          description: Status code of the span
          type: string
        statusMessage:
          description: Status message
          type: string
      required:
      - durationNs
      - spanAttributes
      - spanId
      - spanName
      - timestamp
      - traceId
      type: object
    BuildInfo:
      properties:
        dockerfileContent:
          description: The Dockerfile content used for the build
          example: 'FROM node:14

            WORKDIR /app

            COPY . .

            RUN npm install

            CMD ["npm", "start"]'
          type: string
        contextHashes:
          description: The context hashes used for the build
          example:
          - hash1
          - hash2
          items:
            type: string
          type: array
        createdAt:
          description: The creation timestamp
          format: date-time
          type: string
        updatedAt:
          description: The last update timestamp
          format: date-time
          type: string
        snapshotRef:
          description: The snapshot reference
          example: daytonaio/sandbox:latest
          type: string
      required:
      - createdAt
      - snapshotRef
      - updatedAt
      type: object
    SandboxDesiredState:
      description: The desired state of the sandbox
      enum:
      - destroyed
      - started
      - stopped
      - resized
      - archived
      - paused
      type: string
    PaginatedLogs:
      example:
        total: 6
        totalPages: 5
        page: 1
        items:
        - traceId: traceId
          spanId: spanId
          severityText: severityText
          severityNumber: 0.8008281904610115
          logAttributes:
            key: logAttributes
          body: body
          serviceName: serviceName
          resourceAttributes:
            key: resourceAttributes
          timestamp: timestamp
        - traceId: traceId
          spanId: spanId
          severityText: severityText
          severityNumber: 0.8008281904610115
          logAttributes:
            key: logAttributes
          body: body
          serviceName: serviceName
          resourceAttributes:
            key: resourceAttributes
          timestamp: timestamp
      properties:
        items:
