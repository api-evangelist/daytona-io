openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Volumes API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: Volumes
paths:
  /volumes:
    get:
      operationId: listVolumes
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Include deleted volumes in the response
        explode: true
        in: query
        name: includeDeleted
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VolumeDto'
                type: array
          description: List of all volumes
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List all volumes
      tags:
      - Volumes
    post:
      operationId: createVolume
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolume'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeDto'
          description: The volume has been successfully created.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create a new volume
      tags:
      - Volumes
  /volumes/{volumeId}:
    delete:
      operationId: deleteVolume
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the volume
        explode: false
        in: path
        name: volumeId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          description: Volume has been marked for deletion
        '409':
          description: Volume is in use by one or more sandboxes
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Delete volume
      tags:
      - Volumes
    get:
      operationId: getVolume
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the volume
        explode: false
        in: path
        name: volumeId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeDto'
          description: Volume details
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get volume details
      tags:
      - Volumes
  /volumes/by-name/{name}:
    get:
      operationId: getVolumeByName
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Name of the volume
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeDto'
          description: Volume details
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get volume details by name
      tags:
      - Volumes
components:
  schemas:
    VolumeDto:
      example:
        organizationId: 123e4567-e89b-12d3-a456-426614174000
        createdAt: '2023-01-01T00:00:00.000Z'
        lastUsedAt: '2023-01-01T00:00:00.000Z'
        errorReason: Error processing volume
        name: my-volume
        id: vol-12345678
        state: ready
        updatedAt: '2023-01-01T00:00:00.000Z'
      properties:
        id:
          description: Volume ID
          example: vol-12345678
          type: string
        name:
          description: Volume name
          example: my-volume
          type: string
        organizationId:
          description: Organization ID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        state:
          allOf:
          - $ref: '#/components/schemas/VolumeState'
          description: Volume state
          example: ready
        createdAt:
          description: Creation timestamp
          example: '2023-01-01T00:00:00.000Z'
          type: string
        updatedAt:
          description: Last update timestamp
          example: '2023-01-01T00:00:00.000Z'
          type: string
        lastUsedAt:
          description: Last used timestamp
          example: '2023-01-01T00:00:00.000Z'
          type:
          - string
          - 'null'
        errorReason:
          description: The error reason of the volume
          example: Error processing volume
          type:
          - string
          - 'null'
      required:
      - createdAt
      - errorReason
      - id
      - name
      - organizationId
      - state
      - updatedAt
      type: object
    CreateVolume:
      example:
        name: name
      properties:
        name:
          type: string
      required:
      - name
      type: object
    VolumeState:
      description: Volume state
      enum:
      - creating
      - ready
      - pending_create
      - pending_delete
      - deleting
      - deleted
      - error
      type: string
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: API Key access
      scheme: bearer
      type: http
    oauth2:
      openIdConnectUrl: http://localhost:3000/.well-known/openid-configuration
      type: openIdConnect
