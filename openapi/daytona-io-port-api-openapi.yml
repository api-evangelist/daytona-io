openapi: 3.2.0
info:
  description: Daytona Toolbox API
  title: Daytona Sandbox Toolbox Port API
  contact: {}
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: v0.0.0-dev
servers:
- url: https://proxy.app.daytona.io/toolbox
  description: Daytona Sandbox Toolbox proxy
tags:
- name: port
paths:
  /port:
    get:
      description: Get a list of all currently active ports
      tags:
      - port
      summary: Get active ports
      operationId: GetPorts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortList'
  /port/{port}/in-use:
    get:
      description: Check if a specific port is currently in use
      tags:
      - port
      summary: Check if port is in use
      operationId: IsPortInUse
      parameters:
      - description: Port number (3000-9999)
        name: port
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsPortInUseResponse'
components:
  schemas:
    IsPortInUseResponse:
      type: object
      properties:
        isInUse:
          type: boolean
    PortList:
      type: object
      properties:
        ports:
          type: array
          items:
            type: integer
