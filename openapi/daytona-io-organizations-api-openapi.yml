components:
  schemas:
    CreateOrganizationRole:
      example:
        permissions:
        - write:registries
        - write:registries
        name: Maintainer
        description: Can manage all resources
      properties:
        name:
          description: The name of the role
          example: Maintainer
          type: string
        description:
          description: The description of the role
          example: Can manage all resources
          type: string
        permissions:
          description: The list of permissions assigned to the role
          items:
            enum:
            - write:registries
            - delete:registries
            - write:snapshots
            - delete:snapshots
            - write:sandboxes
            - delete:sandboxes
            - read:volumes
            - write:volumes
            - delete:volumes
            - write:regions
            - delete:regions
            - read:runners
            - write:runners
            - delete:runners
            - read:audit_logs
            - manage:api_keys
            - manage:secrets
            - read:limits
            - manage:sso
            - read:billing
            - manage:billing
            type: string
            x-enum-varnames:
            - WRITE_REGISTRIES
            - DELETE_REGISTRIES
            - WRITE_SNAPSHOTS
            - DELETE_SNAPSHOTS
            - WRITE_SANDBOXES
            - DELETE_SANDBOXES
            - READ_VOLUMES
            - WRITE_VOLUMES
            - DELETE_VOLUMES
            - WRITE_REGIONS
            - DELETE_REGIONS
            - READ_RUNNERS
            - WRITE_RUNNERS
            - DELETE_RUNNERS
            - READ_AUDIT_LOGS
            - MANAGE_API_KEYS
            - MANAGE_SECRETS
            - READ_LIMITS
            - MANAGE_SSO
            - READ_BILLING
            - MANAGE_BILLING
          type: array
      required:
      - description
      - name
      - permissions
      type: object
    GenerateWorkosAdminPortalLink:
      example:
        intent: ''
      properties:
        intent:
          allOf:
          - $ref: '#/components/schemas/WorkosAdminPortalIntent'
          description: 'Which setup flow to open: sso for a single sign-on connection, dsync for SCIM directory sync'
      required:
      - intent
      type: object
    RegenerateApiKeyResponse:
      example:
        apiKey: api-key-xyz123
      properties:
        apiKey:
          description: The newly generated API key
          example: api-key-xyz123
          type: string
      required:
      - apiKey
      type: object
    Region:
      example:
        organizationId: 123e4567-e89b-12d3-a456-426614174000
        otelEndpoint: https://otel-collector.example.com:4318
        createdAt: '2023-01-01T00:00:00.000Z'
        snapshotManagerUrl: http://snapshot-manager.example.com
        regionType: shared
        proxyUrl: https://proxy.example.com
        name: us-east-1
        sshGatewayUrl: http://ssh-gateway.example.com
        id: '123456789012'
        updatedAt: '2023-01-01T00:00:00.000Z'
      properties:
        id:
          description: Region ID
          example: '123456789012'
          type: string
        name:
          description: Region name
          example: us-east-1
          type: string
        organizationId:
          description: Organization ID
          example: 123e4567-e89b-12d3-a456-426614174000
          type:
          - string
          - 'null'
        regionType:
          allOf:
          - $ref: '#/components/schemas/RegionType'
          description: The type of the region
          example: shared
        createdAt:
          description: Creation timestamp
          example: '2023-01-01T00:00:00.000Z'
          type: string
        updatedAt:
          description: Last update timestamp
          example: '2023-01-01T00:00:00.000Z'
          type: string
        proxyUrl:
          description: Proxy URL for the region
          example: https://proxy.example.com
          type:
          - string
          - 'null'
        sshGatewayUrl:
          description: SSH Gateway URL for the region
          example: http://ssh-gateway.example.com
          type:
          - string
          - 'null'
        snapshotManagerUrl:
          description: Snapshot Manager URL for the region
          example: http://snapshot-manager.example.com
          type:
          - string
          - 'null'
        otelEndpoint:
          description: OTel collector endpoint for sandboxes created in this region. When set, sandbox OTel data is sent to this endpoint instead of the Daytona-hosted collector and will not be available in the Daytona analytics API or dashboard.
          example: https://otel-collector.example.com:4318
          type:
          - string
          - 'null'
      required:
      - createdAt
      - id
      - name
      - regionType
      - updatedAt
      type: object
    IdentityProvider:
      example:
        organizationId: 123e4567-e89b-12d3-a456-426614174000
        createdAt: '2025-01-01T00:00:00.000Z'
        trustEmailVerified: false
        defaultAssignedRoleIds:
        - 00000000-0000-0000-0000-000000000001
        oidcConfig: ''
        name: Company Okta
        emailDomains:
        - company.com
        - corp.company.com
        id: 123e4567-e89b-12d3-a456-426614174000
        allowAnyDomain: false
        enabled: true
        updatedAt: '2025-01-01T00:00:00.000Z'
      properties:
        id:
          description: Unique identifier
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        organizationId:
          description: Organization ID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        name:
          description: Display name for the identity provider
          example: Company Okta
          type: string
        oidcConfig:
          allOf:
          - $ref: '#/components/schemas/OidcIdPConfigResponse'
          description: OIDC configuration (secret redacted)
        emailDomains:
          description: Email domains used for IdP discovery on the login form. May be empty when `allowAnyDomain` is true.
          example:
          - company.com
          - corp.company.com
          items:
            type: string
          type: array
        allowAnyDomain:
          description: Whether the IdP accepts any email domain returned by the external provider
          example: false
          type: boolean
        trustEmailVerified:
          description: Whether the `email_verified` claim check is skipped on SSO logins through this identity provider
          example: false
          type: boolean
        defaultAssignedRoleIds:
          description: Organization role IDs assigned to users who join via SSO through this identity provider
          example:
          - 00000000-0000-0000-0000-000000000001
          items:
            type: string
          type: array
        enabled:
          description: Whether the identity provider is enabled
          example: true
          type: boolean
        createdAt:
          description: Creation timestamp
          example: '2025-01-01T00:00:00.000Z'
          format: date-time
          type: string
        updatedAt:
          description: Last update timestamp
          example: '2025-01-01T00:00:00.000Z'
          format: date-time
          type: string
      required:
      - allowAnyDomain
      - createdAt
      - defaultAssignedRoleIds
      - emailDomains
      - enabled
      - id
      - name
      - oidcConfig
      - organizationId
      - trustEmailVerified
      - updatedAt
      type: object
    UpdateOrganizationDefaultRegion:
      example:
        defaultRegionId: us
      properties:
        defaultRegionId:
          description: The ID of the default region for the organization
          example: us
          type: string
      required:
      - defaultRegionId
      type: object
    GpuCapacityResponse:
      example:
        observedAt: '2000-01-23T04:56:07.000Z'
        capacity:
        - availableOnDemand: 0
          gpuType: H100
          availableSpot: 0
        - availableOnDemand: 0
          gpuType: H100
          availableSpot: 0
      properties:
        observedAt:
          description: Time at which this capacity snapshot was calculated. Responses may be cached for up to five seconds.
          format: date-time
          type: string
        capacity:
          items:
            $ref: '#/components/schemas/GpuCapacity'
          type: array
      required:
      - capacity
      - observedAt
      type: object
    TestIdentityProviderConnectionResponse:
      example:
        success: true
        error: error
        issuer: https://company.okta.com
      properties:
        success:
          description: Whether the connection test was successful
          example: true
          type: boolean
        issuer:
          description: The discovered issuer from the OIDC configuration
          example: https://company.okta.com
          type: string
        error:
          description: Error message if the connection test failed
          type: string
      required:
      - success
      type: object
    CreateIdentityProvider:
      example:
        trustEmailVerified: false
        defaultAssignedRoleIds:
        - 00000000-0000-0000-0000-000000000001
        oidcConfig: ''
        name: Company Okta
        emailDomains:
        - company.com
        - corp.company.com
        allowAnyDomain: false
        enabled: true
      properties:
        name:
          description: Display name for the identity provider
          example: Company Okta
          type: string
        oidcConfig:
          allOf:
          - $ref: '#/components/schemas/OidcIdPConfig'
          description: OIDC configuration
        emailDomains:
          default: []
          description: Email domains used for IdP discovery on the login form and to validate the user identity returned by the IdP. Required and must be non-empty unless `allowAnyDomain` is true.
          example:
          - company.com
          - corp.company.com
          items:
            type: string
          type: array
        allowAnyDomain:
          default: false
          description: When true, the IdP accepts any email domain returned by the external provider. Disables the post-callback domain check and allows `emailDomains` to be empty. Only enable for trusted IdPs that strictly control which users can authenticate.
          example: false
          type: boolean
        trustEmailVerified:
          default: false
          description: 'When true, skip the `email_verified` claim check on SSO logins through this identity provider. Only intended for providers that never emit the claim (e.g. Microsoft Entra ID). Risky: only enable if the IdP strictly controls its users'' email addresses.'
          example: false
          type: boolean
        defaultAssignedRoleIds:
          default: []
          description: 'Organization role IDs assigned to users who join the organization via SSO through this identity provider. Roles must be global or belong to this organization. Empty (default) grants the lowest access: membership with no resource permissions.'
          example:
          - 00000000-0000-0000-0000-000000000001
          items:
            type: string
          type: array
        enabled:
          default: true
          description: Whether the identity provider is enabled
          example: true
          type: boolean
      required:
      - emailDomains
      - name
      - oidcConfig
      type: object
    OidcIdPConfigResponse:
      properties:
        issuerUrl:
          description: OIDC Issuer URL
          example: https://company.okta.com
          type: string
        clientId:
          description: OAuth Client ID
          example: abc123
          type: string
        scope:
          description: OAuth scopes
          example: openid email profile
          type: string
      required:
      - clientId
      - issuerUrl
      type: object
    WorkosSsoConnection:
      example:
        createdAt: '2000-01-23T04:56:07.000Z'
        name: name
        domains:
        - domains
        - domains
        id: id
        state: active
        connectionType: OktaSAML
        updatedAt: '2000-01-23T04:56:07.000Z'
      properties:
        id:
          description: WorkOS connection ID
          type: string
        name:
          description: Connection name as set in the WorkOS Admin Portal
          type: string
        connectionType:
          description: WorkOS connection type, e.g. OktaSAML, AzureSAML, GenericOIDC
          example: OktaSAML
          type: string
        state:
          description: 'WorkOS connection state: active means logins work; draft and requires_type mean setup is incomplete'
          example: active
          type: string
        domains:
          description: Email domains routed to this connection
          items:
            type: string
          type: array
        createdAt:
          description: When the connection was created in WorkOS
          format: date-time
          type: string
        updatedAt:
          description: When the connection was last changed in WorkOS
          format: date-time
          type: string
      required:
      - connectionType
      - createdAt
      - domains
      - id
      - name
      - state
      - updatedAt
      type: object
    GpuCapacity:
      example:
        availableOnDemand: 0
        gpuType: H100
        availableSpot: 0
      properties:
        gpuType:
          allOf:
          - $ref: '#/components/schemas/GpuType'
