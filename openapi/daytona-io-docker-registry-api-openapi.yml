openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Docker Registry API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: docker-registry
paths:
  /docker-registry:
    get:
      operationId: listRegistries
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DockerRegistry'
                type: array
          description: List of all docker registries
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List registries
      tags:
      - docker-registry
    post:
      operationId: createRegistry
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDockerRegistry'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerRegistry'
          description: The docker registry has been successfully created.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create registry
      tags:
      - docker-registry
  /docker-registry/registry-push-access:
    get:
      operationId: getTransientPushAccess
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the region where the snapshot will be available (defaults to organization default region)
        explode: true
        in: query
        name: regionId
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPushAccessDto'
          description: Temporary registry access has been generated
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get temporary registry access for pushing snapshots
      tags:
      - docker-registry
  /docker-registry/{id}:
    delete:
      operationId: deleteRegistry
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the docker registry
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: The docker registry has been successfully deleted.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Delete registry
      tags:
      - docker-registry
    get:
      operationId: getRegistry
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the docker registry
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerRegistry'
          description: The docker registry
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get registry
      tags:
      - docker-registry
    patch:
      operationId: updateRegistry
      parameters:
      - description: Use with JWT to specify the organization ID
        explode: false
        in: header
        name: X-Daytona-Organization-ID
        required: false
        schema:
          type: string
        style: simple
      - description: ID of the docker registry
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDockerRegistry'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerRegistry'
          description: The docker registry has been successfully updated.
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Update registry
      tags:
      - docker-registry
components:
  schemas:
    UpdateDockerRegistry:
      example:
        password: password
        name: name
        project: project
        url: url
        username: username
      properties:
        name:
          description: Registry name
          type: string
        url:
          description: Registry URL
          type: string
        username:
          description: Registry username
          type: string
        password:
          description: Registry password
          type: string
        project:
          description: Registry project
          type: string
      required:
      - name
      - url
      - username
      type: object
    DockerRegistry:
      example:
        registryType: internal
        createdAt: '2024-01-31T12:00:00.000Z'
        name: My Docker Hub
        project: my-project
        id: 123e4567-e89b-12d3-a456-426614174000
        url: https://registry.hub.docker.com
        username: username
        updatedAt: '2024-01-31T12:00:00.000Z'
      properties:
        id:
          description: Registry ID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        name:
          description: Registry name
          example: My Docker Hub
          type: string
        url:
          description: Registry URL
          example: https://registry.hub.docker.com
          type: string
        username:
          description: Registry username
          example: username
          type: string
        project:
          description: Registry project
          example: my-project
          type: string
        registryType:
          description: Registry type
          enum:
          - internal
          - organization
          - transient
          - backup
          example: internal
          type: string
        createdAt:
          description: Creation timestamp
          example: '2024-01-31T12:00:00.000Z'
          format: date-time
          type: string
        updatedAt:
          description: Last update timestamp
          example: '2024-01-31T12:00:00.000Z'
          format: date-time
          type: string
      required:
      - createdAt
      - id
      - name
      - project
      - registryType
      - updatedAt
      - url
      - username
      type: object
    RegistryPushAccessDto:
      example:
        registryUrl: registry.example.com
        registryId: 123e4567-e89b-12d3-a456-426614174000
        project: library
        secret: eyJhbGciOiJIUzI1NiIs...
        expiresAt: '2023-12-31T23:59:59.000Z'
        username: temp-user-123
      properties:
        username:
          description: Temporary username for registry authentication
          example: temp-user-123
          type: string
        secret:
          description: Temporary secret for registry authentication
          example: eyJhbGciOiJIUzI1NiIs...
          type: string
        registryUrl:
          description: Registry URL
          example: registry.example.com
          type: string
        registryId:
          description: Registry ID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        project:
          description: Registry project ID
          example: library
          type: string
        expiresAt:
          description: Token expiration time in ISO format
          example: '2023-12-31T23:59:59.000Z'
          type: string
      required:
      - expiresAt
      - project
      - registryId
      - registryUrl
      - secret
      - username
      type: object
    CreateDockerRegistry:
      example:
        password: password
        name: name
        project: project
        url: url
        username: username
      properties:
        name:
          description: Registry name
          type: string
        url:
          description: Registry URL
          type: string
        username:
          description: Registry username
          type: string
        password:
          description: Registry password
          type: string
        project:
          description: Registry project
          type: string
      required:
      - name
      - password
      - url
      - username
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: API Key access
      scheme: bearer
      type: http
    oauth2:
      openIdConnectUrl: http://localhost:3000/.well-known/openid-configuration
      type: openIdConnect
x-provenance:
  method: harvested
  publisher: Daytona
  source: https://www.daytona.io/docs/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
