openapi: 3.1.0
paths:
  /sandbox:
    get:
      operationId: listSandboxes
      parameters:
      - name: X-Daytona-Organization-ID
        in: header
        description: Use with JWT to specify the organization ID
        required: false
        schema:
          type: string
      - name: verbose
        required: false
        in: query
        description: Include verbose output
        schema:
          type: boolean
      - name: labels
        required: false
        in: query
        description: JSON encoded labels to filter by
        schema:
          example: '{"label1": "value1", "label2": "value2"}'
          type: string
      - name: includeErroredDeleted
        required: false
        in: query
        description: Include errored and deleted sandboxes
        schema:
          type: boolean
      responses:
        '200':
          description: List of all sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sandbox'
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List all sandboxes
      tags:
      - sandbox
    post:
      operationId: createSandbox
      parameters:
      - name: X-Daytona-Organization-ID
        in: header
        description: Use with JWT to specify the organization ID
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandbox'
      responses:
        '200':
          description: The sandbox has been successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Create a new sandbox
      tags:
      - sandbox
  /sandbox/paginated:
    get:
      operationId: listSandboxesPaginated
      parameters:
      - name: X-Daytona-Organization-ID
        in: header
        description: Use with JWT to specify the organization ID
        required: false
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number of the results
        schema:
          minimum: 1
          default: 1
          type: number
      - name: limit
        required: false
        in: query
        description: Number of results per page
        schema:
          minimum: 1
          maximum: 200
          default: 100
          type: number
      - name: id
        required: false
        in: query
        description: Filter by partial ID match
        schema:
          example: abc123
          type: string
      - name: name
        required: false
        in: query
        description: Filter by partial name match
        schema:
          example: abc123
          type: string
      - name: labels
        required: false
        in: query
        description: JSON encoded labels to filter by
        schema:
          example: '{"label1": "value1", "label2": "value2"}'
          type: string
      - name: includeErroredDeleted
        required: false
        in: query
        description: Include results with errored state and deleted desired state
        schema:
          default: false
          type: boolean
      - name: states
        required: false
        in: query
        description: List of states to filter by
        schema:
          type: array
          items:
            type: string
            enum:
            - creating
            - restoring
            - destroying
            - started
            - stopped
            - starting
            - stopping
            - error
            - build_failed
            - pending_build
            - building_snapshot
            - unknown
            - pulling_snapshot
            - archived
            - archiving
            - resizing
            - snapshotting
            - forking
      - name: snapshots
        required: false
        in: query
        description: List of snapshot names to filter by
        schema:
          type: array
          items:
            type: string
      - name: regions
        required: false
        in: query
        description: List of regions to filter by
        schema:
          type: array
          items:
            type: string
      - name: minCpu
        required: false
        in: query
        description: Minimum CPU
        schema:
          minimum: 1
          type: number
      - name: maxCpu
        required: false
        in: query
        description: Maximum CPU
        schema:
          minimum: 1
          type: number
      - name: minMemoryGiB
        required: false
        in: query
        description: Minimum memory in GiB
        schema:
          minimum: 1
          type: number
      - name: maxMemoryGiB
        required: false
        in: query
        description: Maximum memory in GiB
        schema:
          minimum: 1
          type: number
      - name: minDiskGiB
        required: false
        in: query
        description: Minimum disk space in GiB
        schema:
          minimum: 1
          type: number
      - name: maxDiskGiB
        required: false
        in: query
        description: Maximum disk space in GiB
        schema:
          minimum: 1
          type: number
      - name: lastEventAfter
        required: false
        in: query
        description: Include items with last event after this timestamp
        schema:
          format: date-time
          example: '2024-01-01T00:00:00Z'
          type: string
      - name: lastEventBefore
        required: false
        in: query
        description: Include items with last event before this timestamp
        schema:
          format: date-time
          example: '2024-12-31T23:59:59Z'
          type: string
      - name: sort
        required: false
        in: query
        description: Field to sort by
        schema:
          default: createdAt
          type: string
          enum:
          - id
          - name
          - state
          - snapshot
          - region
          - updatedAt
          - createdAt
          - lastActivityAt
      - name: order
        required: false
        in: query
        description: Direction to sort by
        schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Paginated list of all sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSandboxes'
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List all sandboxes paginated
      tags:
      - sandbox
  /sandbox/for-runner:
    get:
      operationId: getSandboxesForRunner
      parameters:
      - name: X-Daytona-Organization-ID
        in: header
        description: Use with JWT to specify the organization ID
        required: false
        schema:
          type: string
      - name: states
        required: false
        in: query
        description: Comma-separated list of sandbox states to filter by
        schema:
          type: string
      - name: skipReconcilingSandboxes
        required: false
        in: query
        description: Skip sandboxes where state differs from desired state
