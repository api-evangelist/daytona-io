        in: header
        description: Use with JWT to specify the organization ID
        required: false
        schema:
          type: string
      - name: sandboxIdOrName
        required: true
        in: path
        description: ID or name of the sandbox
        schema:
          type: string
      responses:
        '200':
          description: Sandbox has been deleted
