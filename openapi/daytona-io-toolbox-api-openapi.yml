      - sessionId
    PtyListResponse:
      type: object
      properties:
        sessions:
          description: List of active PTY sessions
          type: array
          items:
            $ref: '#/components/schemas/PtySessionInfo'
      required:
      - sessions
    CompressedScreenshotResponse:
      type: object
      properties:
        screenshot:
          type: string
          description: Base64 encoded compressed screenshot image data
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
        cursorPosition:
          type: object
          description: The current cursor position when the compressed screenshot was taken
          example:
            x: 250
            y: 150
        sizeBytes:
          type: number
          description: The size of the compressed screenshot data in bytes
          example: 12288
      required:
      - screenshot
    Command:
      type: object
      properties:
        id:
          type: string
          description: The ID of the command
          example: cmd-123
        command:
          type: string
          description: The command that was executed
          example: ls -la
        exitCode:
          type: number
          description: The exit code of the command
          example: 0
      required:
      - id
      - command
    MouseClickRequest:
      type: object
      properties:
        x:
          type: number
          description: The X coordinate where to perform the mouse click
          example: 100
        y:
          type: number
          description: The Y coordinate where to perform the mouse click
          example: 200
        button:
          type: string
          description: The mouse button to click (left, right, middle). Defaults to left
          example: left
        double:
          type: boolean
          description: Whether to perform a double-click instead of a single click
          example: false
      required:
      - x
      - y
    ExecuteResponse:
      type: object
      properties:
        exitCode:
          type: number
          description: Exit code
          example: 0
        result:
          type: string
          description: Command output
          example: Command output here
      required:
      - exitCode
      - result
    CompletionList:
      type: object
      properties:
        isIncomplete:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompletionItem'
      required:
      - isIncomplete
      - items
    MouseClickResponse:
      type: object
      properties:
        x:
          type: number
          description: The actual X coordinate where the click occurred
          example: 100
        y:
          type: number
          description: The actual Y coordinate where the click occurred
          example: 200
      required:
      - x
      - y
    MouseMoveResponse:
      type: object
      properties:
        x:
          type: number
          description: The actual X coordinate where the mouse cursor ended up
          example: 150
        y:
          type: number
          description: The actual Y coordinate where the mouse cursor ended up
          example: 250
      required:
      - x
      - y
    DisplayInfoResponse:
      type: object
      properties:
        displays:
          description: Array of display information for all connected displays
          example:
          - id: 0
            x: 0
            y: 0
            width: 1920
            height: 1080
            is_active: true
          type: array
          items:
            type: object
      required:
      - displays
