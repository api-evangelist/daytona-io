components:
  schemas:
    ScreenshotResponse:
      type: object
      properties:
        screenshot:
          type: string
          description: Base64 encoded screenshot image data
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
        cursorPosition:
          type: object
          description: The current cursor position when the screenshot was taken
          example:
            x: 500
            y: 300
        sizeBytes:
          type: number
          description: The size of the screenshot data in bytes
          example: 24576
      required:
      - screenshot
    GitCommitResponse:
      type: object
      properties:
        hash:
          type: string
      required:
      - hash
    ListBranchResponse:
      type: object
      properties:
        branches:
          type: array
          items:
            type: string
      required:
      - branches
    ProcessStatusResponse:
      type: object
      properties:
        processName:
          type: string
          description: The name of the VNC process being checked
          example: xfce4
        running:
          type: boolean
          description: Whether the specified VNC process is currently running
          example: true
      required:
      - processName
      - running
    UploadFile:
      type: object
      properties:
        file:
          type: string
          format: binary
        path:
          type: string
      required:
      - file
      - path
    KeyboardTypeRequest:
      type: object
      properties:
        text:
          type: string
          description: The text to type using the keyboard
          example: Hello, World!
        delay:
          type: number
          description: Delay in milliseconds between keystrokes. Defaults to 0
          example: 100
      required:
      - text
    KeyboardHotkeyRequest:
      type: object
      properties:
        keys:
          type: string
          description: The hotkey combination to press (e.g., "ctrl+c", "cmd+v", "alt+tab")
          example: ctrl+c
      required:
      - keys
    PtySessionInfo:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the PTY session
          example: pty-session-12345
        cwd:
          type: string
          description: Starting directory for the PTY session, defaults to the sandbox's working directory
          example: /home/user
        envs:
          type: object
          description: Environment variables for the PTY session
          example:
            TERM: xterm-256color
            PS1: '\u@daytona:\w$ '
        cols:
          type: number
          description: Number of terminal columns
          example: 80
        rows:
          type: number
          description: Number of terminal rows
          example: 24
        createdAt:
          type: string
          description: When the PTY session was created
          example: '2024-01-15T10:30:45Z'
        active:
          type: boolean
          description: Whether the PTY session is currently active
          example: true
        lazyStart:
          type: boolean
          description: Whether the PTY session uses lazy start (only start when first client connects)
          example: false
          default: false
      required:
      - id
      - cwd
      - envs
      - cols
      - rows
      - createdAt
      - active
      - lazyStart
    ProcessErrorsResponse:
      type: object
      properties:
        processName:
          type: string
          description: The name of the VNC process whose error logs were retrieved
          example: x11vnc
        errors:
          type: string
          description: The error log output from the specified VNC process
          example: 2024-01-15 10:30:45 [ERROR] Failed to bind to port 5901
      required:
      - processName
      - errors
    GitBranchRequest:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
      required:
      - path
      - name
    ProcessLogsResponse:
      type: object
      properties:
        processName:
          type: string
          description: The name of the VNC process whose logs were retrieved
          example: novnc
        logs:
          type: string
          description: The log output from the specified VNC process
          example: 2024-01-15 10:30:45 [INFO] NoVNC server started on port 6080
      required:
      - processName
      - logs
    WorkDirResponse:
      type: object
      properties:
        dir:
          type: string
    ComputerUseStartResponse:
      type: object
      properties:
        message:
          type: string
          description: A message indicating the result of starting computer use processes
          example: Computer use processes started successfully
        status:
          type: object
          description: Status information about all VNC desktop processes after starting
          example:
            xvfb:
              running: true
              priority: 100
              autoRestart: true
              pid: 12345
            xfce4:
              running: true
              priority: 200
              autoRestart: true
              pid: 12346
            x11vnc:
              running: true
              priority: 300
              autoRestart: true
              pid: 12347
            novnc:
              running: true
              priority: 400
              autoRestart: true
              pid: 12348
      required:
      - message
      - status
    GitCommitInfo:
      type: object
      properties:
        hash:
          type: string
        message:
          type: string
        author:
          type: string
        email:
          type: string
        timestamp:
          type: string
      required:
      - hash
      - message
      - author
      - email
      - timestamp
    PtyResizeRequest:
      type: object
      properties:
        cols:
          type: number
          description: Number of terminal columns
          example: 80
        rows:
          type: number
          description: Number of terminal rows
          example: 24
      required:
      - cols
      - rows
    GitCommitRequest:
      type: object
      properties:
        path:
          type: string
        message:
          type: string
        author:
          type: string
        email:
          type: string
        allow_empty:
          type: boolean
          description: Allow creating an empty commit when no changes are staged
          default: false
      required:
      - path
      - message
      - author
      - email
    SearchFilesResponse:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
      required:
      - files
    MouseMoveRequest:
      type: object
      properties:
        x:
          type: number
          description: The target X coordinate to move the mouse cursor to
          example: 150
        y:
          type: number
          description: The target Y coordinate to move the mouse cursor to
          example: 250
      required:
      - x
      - y
    FileInfo:
      type: object
      properties:
        name:
          type: string
        isDir:
          type: boolean
        size:
          type: number
        modTime:
          type: string
        mode:
          type: string
        permissions:
          type: string
        owner:
          type: string
        group:
          type: string
      required:
      - name
      - isDir
      - size
      - modTime
      - mode
      - permissions
      - owner
      - group
    Match:
      type: object
      properties:
        file:
          type: string
        line:
          type: number
        content:
          type: string
      required:
      - file
      - line
      - content
    CompletionItem:
      type: object
      properties:
        label:
          type: string
        kind:
          type: number
        detail:
          type: string
        documentation:
          type: object
        sortText:
          type: string
        filterText:
          type: string
        insertText:
          type: string
      required:
      - label
    WindowsResponse:
      type: object
      properties:
        windows:
          description: Array of window information for all visible windows
          example:
          - id: 12345
            title: Terminal
          type: array
          items:
            type: object
        count:
          type: number
          description: The total number of windows found
          example: 5
      required:
      - windows
      - count
    CreateSessionRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The ID of the session
          example: session-123
      required:
      - sessionId
    FileStatus:
      type: object
      properties:
        name:
          type: string
        staging:
          type: string
        worktree:
          type: string
        extra:
          type: string
      required:
      - name
      - staging
      - worktree
      - extra
    SessionExecuteRequest:
      type: object
      properties:
        command:
          type: string
          description: The command to execute
          example: ls -la
        runAsync:
          type: boolean
          description: Whether to execute the command asynchronously
          example: false
        async:
          type: boolean
          description: 'Deprecated: Use runAsync instead. Whether to execute the command asynchronously'
          example: false
          deprecated: true
      required:
      - command
    LspDocumentRequest:
      type: object
      properties:
        languageId:
          type: string
          description: Language identifier
        pathToProject:
          type: string
          description: Path to the project
        uri:
          type: string
          description: Document URI
      required:
      - languageId
      - pathToProject
      - uri
    MouseScrollRequest:
      type: object
      properties:
        x:
          type: number
          description: The X coordinate where to perform the scroll operation
          example: 100
        y:
          type: number
          description: The Y coordinate where to perform the scroll operation
          example: 200
        direction:
          type: string
          description: The scroll direction (up, down)
          example: down
        amount:
          type: number
          description: The number of scroll units to scroll. Defaults to 1
          example: 3
      required:
      - x
      - y
      - direction
    LspSymbol:
      type: object
      properties:
        kind:
          type: number
        location:
          $ref: '#/components/schemas/LspLocation'
        name:
          type: string
      required:
      - kind
      - location
      - name
    MousePosition:
      type: object
      properties:
        x:
          type: number
          description: The X coordinate of the mouse cursor position
          example: 100
        y:
          type: number
          description: The Y coordinate of the mouse cursor position
          example: 200
      required:
      - x
      - y
    ComputerUseStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of computer use services (active, partial, inactive, error)
          example: active
          enum:
          - active
          - partial
          - inactive
          - error
      required:
      - status
    LspServerRequest:
      type: object
      properties:
        languageId:
          type: string
          description: Language identifier
        pathToProject:
          type: string
          description: Path to the project
      required:
      - languageId
      - pathToProject
    MouseScrollResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the mouse scroll operation was successful
          example: true
      required:
      - success
    MouseDragRequest:
      type: object
      properties:
        startX:
          type: number
          description: The starting X coordinate for the drag operation
          example: 100
        startY:
          type: number
          description: The starting Y coordinate for the drag operation
          example: 200
        endX:
          type: number
          description: The ending X coordinate for the drag operation
          example: 300
        endY:
          type: number
          description: The ending Y coordinate for the drag operation
          example: 400
        button:
          type: string
          description: The mouse button to use for dragging (left, right, middle). Defaults to left
          example: left
      required:
      - startX
      - startY
      - endX
      - endY
    Session:
      type: object
      properties:
        sessionId:
          type: string
          description: The ID of the session
          example: session-123
        commands:
          description: The list of commands executed in this session
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/Command'
      required:
      - sessionId
      - commands
    GitStatus:
      type: object
      properties:
        currentBranch:
          type: string
        fileStatus:
          type: array
          items:
            $ref: '#/components/schemas/FileStatus'
        ahead:
          type: number
        behind:
          type: number
        branchPublished:
          type: boolean
      required:
      - currentBranch
      - fileStatus
    ReplaceRequest:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
        pattern:
          type: string
        newValue:
          type: string
      required:
      - files
      - pattern
      - newValue
    LspLocation:
      type: object
      properties:
        range:
          $ref: '#/components/schemas/Range'
        uri:
          type: string
      required:
      - range
      - uri
    Range:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/Position'
        end:
          $ref: '#/components/schemas/Position'
      required:
      - start
      - end
    PtyCreateResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: The unique identifier for the created PTY session
          example: pty-session-12345
