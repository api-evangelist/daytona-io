openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Preview API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: Preview
paths:
  /preview/{sandboxId}/public:
    get:
      operationId: isSandboxPublic
      parameters:
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: Public status of the sandbox
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Check if sandbox is public
      tags:
      - Preview
  /preview/{sandboxId}/preview-warning:
    get:
      operationId: isPreviewWarningEnabled
      parameters:
      - description: ID of the sandbox, or a signed preview URL token (requires the port query param)
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      - description: Port the signed preview URL token was issued for. Required when sandboxId is a signed token.
        explode: true
        in: query
        name: port
        required: false
        schema:
          type: number
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewWarning'
          description: Whether the preview warning page is enabled for the sandbox
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Check if the preview warning page is enabled for the sandbox
      tags:
      - Preview
  /preview/{sandboxId}/validate/{authToken}:
    get:
      operationId: isValidAuthToken
      parameters:
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      - description: Auth token of the sandbox
        explode: false
        in: path
        name: authToken
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: Sandbox auth token validation status
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Check if sandbox auth token is valid
      tags:
      - Preview
  /preview/{sandboxId}/signing-key:
    get:
      operationId: getSigningKey
      parameters:
      - description: ID of the sandbox
        explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Signing key of the sandbox
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get the signing key for a sandbox
      tags:
      - Preview
  /preview/{sandboxId}/access:
    get:
      operationId: hasSandboxAccess
      parameters:
      - explode: false
        in: path
        name: sandboxId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                type: boolean
          description: User access status to the sandbox
        '404':
          description: Sandbox not found. For members of the owning organization whose sandbox was deleted, the body carries code "SANDBOX_DESTROYED".
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Check if user has access to the sandbox
      tags:
      - Preview
  /preview/{signedPreviewToken}/{port}/sandbox-id:
    get:
      operationId: getSandboxIdFromSignedPreviewUrlToken
      parameters:
      - description: Signed preview URL token
        explode: false
        in: path
        name: signedPreviewToken
        required: true
        schema:
          type: string
        style: simple
      - description: Port number to get sandbox ID from signed preview URL token
        explode: false
        in: path
        name: port
        required: true
        schema:
          type: number
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Sandbox ID from signed preview URL token
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get sandbox ID from signed preview URL token
      tags:
      - Preview
components:
  schemas:
    PreviewWarning:
      example:
        enabled: true
      properties:
        enabled:
          description: Whether the preview warning page is enabled for the sandbox
          type: boolean
      required:
      - enabled
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: API Key access
      scheme: bearer
      type: http
    oauth2:
      openIdConnectUrl: http://localhost:3000/.well-known/openid-configuration
      type: openIdConnect
x-provenance:
  method: harvested
  publisher: Daytona
  source: https://www.daytona.io/docs/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
