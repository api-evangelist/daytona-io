openapi: 3.2.0
info:
  contact:
    email: support@daytona.com
    name: Daytona Platforms Inc.
    url: https://www.daytona.io
  description: Daytona AI platform API Docs
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Jobs API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: Jobs
paths:
  /jobs:
    get:
      description: Returns a paginated list of jobs for the runner, optionally filtered by status.
      operationId: listJobs
      parameters:
      - description: Page number of the results
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: 'Maximum number of jobs to return (default: 100, max: 500)'
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Filter jobs by status
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/JobStatus'
        style: form
      - description: 'Number of jobs to skip for pagination (default: 0)'
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobs'
          description: List of jobs for the runner
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: List jobs for the runner
      tags:
      - Jobs
  /jobs/poll:
    get:
      description: Long poll endpoint for runners to fetch pending jobs. Returns immediately if jobs are available, otherwise waits up to timeout seconds.
      operationId: pollJobs
      parameters:
      - description: 'Timeout in seconds for long polling (default: 30, max: 60)'
        explode: true
        in: query
        name: timeout
        required: false
        schema:
          type: integer
        style: form
      - description: 'Maximum number of jobs to return (default: 10, max: 100)'
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollJobsResponse'
          description: List of jobs for the runner
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Long poll for jobs
      tags:
      - Jobs
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
      - description: ID of the job
        explode: false
        in: path
        name: jobId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: Job details
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Get job details
      tags:
      - Jobs
  /jobs/{jobId}/status:
    post:
      operationId: updateJobStatus
      parameters:
      - description: ID of the job
        explode: false
        in: path
        name: jobId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobStatus'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: Job status updated successfully
      security:
      - bearer: []
      - oauth2:
        - openid
        - profile
        - email
      summary: Update job status
      tags:
      - Jobs
components:
  schemas:
    UpdateJobStatus:
      example:
        resultMetadata: resultMetadata
        errorMessage: Failed to create sandbox
        status: IN_PROGRESS
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatus'
          description: The new status of the job
          example: IN_PROGRESS
        errorMessage:
          description: Error message if the job failed
          example: Failed to create sandbox
          type: string
        resultMetadata:
          description: Result metadata for the job
          type: string
      required:
      - status
      type: object
    JobType:
      description: The type of the job
      enum:
      - CREATE_SANDBOX
      - START_SANDBOX
      - STOP_SANDBOX
      - DESTROY_SANDBOX
      - RESIZE_SANDBOX
      - CREATE_BACKUP
      - BUILD_SNAPSHOT
      - PULL_SNAPSHOT
      - RECOVER_SANDBOX
      - INSPECT_SNAPSHOT_IN_REGISTRY
      - REMOVE_SNAPSHOT
      - UPDATE_SANDBOX_NETWORK_SETTINGS
      - UPDATE_SANDBOX_SECRETS
      - SNAPSHOT_SANDBOX
      - FORK_SANDBOX
      - PAUSE_SANDBOX
      type: string
    PaginatedJobs:
      example:
        total: 0
        totalPages: 1
        page: 6
        items:
        - createdAt: '2024-10-01T12:00:00.000Z'
          resourceId: sandbox123
          payload: payload
          errorMessage: Failed to create sandbox
          id: job123
          type: CREATE_SANDBOX
          traceContext:
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          status: PENDING
          resourceType: SANDBOX
          updatedAt: '2024-10-01T12:00:00.000Z'
        - createdAt: '2024-10-01T12:00:00.000Z'
          resourceId: sandbox123
          payload: payload
          errorMessage: Failed to create sandbox
          id: job123
          type: CREATE_SANDBOX
          traceContext:
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          status: PENDING
          resourceType: SANDBOX
          updatedAt: '2024-10-01T12:00:00.000Z'
      properties:
        items:
          items:
            $ref: '#/components/schemas/Job'
          type: array
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
      - items
      - page
      - total
      - totalPages
      type: object
    PollJobsResponse:
      example:
        jobs:
        - createdAt: '2024-10-01T12:00:00.000Z'
          resourceId: sandbox123
          payload: payload
          errorMessage: Failed to create sandbox
          id: job123
          type: CREATE_SANDBOX
          traceContext:
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          status: PENDING
          resourceType: SANDBOX
          updatedAt: '2024-10-01T12:00:00.000Z'
        - createdAt: '2024-10-01T12:00:00.000Z'
          resourceId: sandbox123
          payload: payload
          errorMessage: Failed to create sandbox
          id: job123
          type: CREATE_SANDBOX
          traceContext:
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          status: PENDING
          resourceType: SANDBOX
          updatedAt: '2024-10-01T12:00:00.000Z'
      properties:
        jobs:
          description: List of jobs
          items:
            $ref: '#/components/schemas/Job'
          type: array
      required:
      - jobs
      type: object
    JobStatus:
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETED
      - FAILED
      type: string
    Job:
      example:
        createdAt: '2024-10-01T12:00:00.000Z'
        resourceId: sandbox123
        payload: payload
        errorMessage: Failed to create sandbox
        id: job123
        type: CREATE_SANDBOX
        traceContext:
          traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        status: PENDING
        resourceType: SANDBOX
        updatedAt: '2024-10-01T12:00:00.000Z'
      properties:
        id:
          description: The ID of the job
          example: job123
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/JobType'
          description: The type of the job
          example: CREATE_SANDBOX
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatus'
          description: The status of the job
          example: PENDING
        resourceType:
          description: The type of resource this job operates on
          enum:
          - SANDBOX
          - SNAPSHOT
          - BACKUP
          example: SANDBOX
          type: string
        resourceId:
          description: The ID of the resource this job operates on (sandboxId, snapshotRef, etc.)
          example: sandbox123
          type: string
        payload:
          description: Job-specific JSON-encoded payload data (operational metadata)
          type: string
        traceContext:
          additionalProperties: true
          description: OpenTelemetry trace context for distributed tracing (W3C Trace Context format)
          example:
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          type: object
        errorMessage:
          description: Error message if the job failed
          example: Failed to create sandbox
          type: string
        createdAt:
          description: The creation timestamp of the job
          example: '2024-10-01T12:00:00.000Z'
          type: string
        updatedAt:
          description: The last update timestamp of the job
          example: '2024-10-01T12:00:00.000Z'
          type: string
      required:
      - createdAt
      - id
      - resourceId
      - resourceType
      - status
      - type
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: API Key access
      scheme: bearer
      type: http
    oauth2:
      openIdConnectUrl: http://localhost:3000/.well-known/openid-configuration
      type: openIdConnect
